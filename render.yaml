services:
  - type: web
    name: shptech
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py makemigrations --noinput && python backend/manage.py migrate --noinput && python backend/manage.py seed_data && python backend/manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "shptech.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://shptechnology.online,http://localhost:5173"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
