<!DOCTYPE html>

    <title>SHP Technology — Redirecting...</title>
    <script>
      // Simple redirect for legacy path links back to Hash Router root
      window.location.replace(window.location.origin + window.location.pathname.split('/').slice(0, 2).join('/') + '/#/');
    </script>
