name: Deploy Website to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Vue Project
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://shptech.onrender.com/api' }}
          VITE_SITE_EMAIL: ${{ vars.VITE_SITE_EMAIL || 'founder.shp@gmail.com' }}
          VITE_SITE_PHONE: ${{ vars.VITE_SITE_PHONE || '+91 9301885654' }}
          VITE_SITE_ADDRESS: ${{ vars.VITE_SITE_ADDRESS || '1st floor, SHP Technology, Near Underground Bridge, Madan Mahal Station' }}
          VITE_GOOGLE_SHEET_WEBHOOK_URL: ${{ vars.VITE_GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
