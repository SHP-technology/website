name: Deploy Next.js Website to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Site
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://shptech.onrender.com/api' }}
          NEXT_PUBLIC_SITE_EMAIL: ${{ vars.NEXT_PUBLIC_SITE_EMAIL || 'founder.shp@gmail.com' }}
          NEXT_PUBLIC_SITE_PHONE: ${{ vars.NEXT_PUBLIC_SITE_PHONE || '+91 9301885654' }}
          NEXT_PUBLIC_SITE_ADDRESS: ${{ vars.NEXT_PUBLIC_SITE_ADDRESS || '1st floor, SHP Technology, Near Underground Bridge, Madan Mahal Station' }}
          NEXT_PUBLIC_GOOGLE_SHEET_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          npm run build
          touch out/.nojekyll
          cp out/index.html out/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
