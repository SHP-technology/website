services:
  - type: web
    name: shptech
    env: python
    region: singapore
    plan: free
    repo: https://github.com/SHP-technology/website
    autoDeploy: true
    branch: main
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py makemigrations --noinput && python backend/manage.py migrate --noinput && python backend/manage.py seed_data && python backend/manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "api.shptechnology.online,shptech.onrender.com,shptech-fofn.onrender.com,*.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://shptechnology.online,https://www.shptechnology.online,http://localhost:5173,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://shptechnology.online,https://www.shptechnology.online,https://shptech.onrender.com,https://shptech-fofn.onrender.com,https://*.onrender.com,http://localhost:8000,http://127.0.0.1:8000"

      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "SHP Technology <onboarding@resend.dev>"
      - key: COMPANY_EMAIL
        value: "hello@shptechnology.online"
